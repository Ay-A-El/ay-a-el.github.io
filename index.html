<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
		<title>Ayman El-Sayed - Portfolio</title>
		<link rel="stylesheet" href="style.css">
		<style id="nonready-sections">section{display:none;}</style>
		<script src="script.js"></script>
	</head>
	<body>
		<header>
			<div id="logo">
				<div style="padding: 10px;">Ay-A-El.github.io</div>
			</div>
			<nav>
				<ul>
					<li><a href="/#home">Home</a></li>
					<li><a href="/#education">Education</a></li>
					<li><a href="/#experience">Experience</a></li>
					<li><a href="/#projects">Projects</a></li>
				</ul>
			</nav>
		</header>
		<main>
			<div id="loading">
				<img src="images/tube-spinner.svg"/>
			</div>
			<section id="home">
				<h1>Biography</h1>
				<div id="biography">
				<figure>
					<img src="images/placeholder-potrait.png"/>
					<figcaption>Ayman El-Sayed</figcaption>
				</figure>
				<div class="content">
				</div>
				</div>
			</section>
			<section id="education">
				<h1>Education</h1>
				<article class="institute">
					<div class="institute-header">
						<figure class="institute-header-logo">
							<a target="_blank" rel="noreferrer"><img /></a>
						</figure>
						<div class="institute-header-text"></div>
					</div>
					<div class="cards">
					</div>
				</article>
			</section>
			<section id="experience">
				<h1>Experience</h1>
				<div class="cards">
					<div class="card">
						<div class="card-header">
							<figure class="card-header-logo">
								<a target="_blank" rel="noreferrer"><img /></a>
							</figure>
							<div class="card-header-texts">
								<div class="card-header-text"></div>
							</div>
						</div>
						<div class="card-description">
							<ul></ul>
						</div>
					</div>
				</div>
			</section>
			<section id="projects">
				<h1>Projects</h1>
				<div class="projects">
					<article class="project">
						<h2></h2>
						<div class="project-wrapper">
						<div class="project-information">
							<ul class="project-stack"></ul>
							<ul class="project-description"></ul>
						</div>
						<figure>
							<a target="_blank" rel="noreferrer"><img /></a>
						</figure>
						</div>
					</article>
				</div>
			</section>
		</main>	
	</body>
</html>
